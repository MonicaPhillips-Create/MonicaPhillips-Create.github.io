<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it yellow">
                <h2>Grocery List</h2>
                
                <ul>
                    <li>milk</li>
                    <li>eggs</li>
                    <li>cheese</li>
                </ul>
                <p>Don't forget napkins!!!</p>

            </div>
                
            <div class="post-it lightblue">
                <p>"I will focus on what I can control and trust the rest"</p>
            </div>

            <br>
                
            <div class="post-it lightgreen">
                <h3>Assignments Due Friday</h3>
                <ol>
                    <li>Math</li>
                    <li>Science</li>
                    <li>History</li>
                </ol>
            </div>

            <div class="post-it pink">
                <h2>***Reminder***</h2>
                <h3>CALL MOM</h3>
            </div>

            <br>

            <div class="post-it purple">
                <img
                    src="images/tangled.jpeg"
                    alt="frozen movie"
                >
                <p>Movie Night @ 7pm</p>
            </div>
            <div class="post-it red">
                <p>You are SMART, <br> You are KIND <br> You are LOVED</p>
            </div>
            
        </div>
    </body>
</html>
