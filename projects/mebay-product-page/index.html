<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Maybay Product Page</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <!-- FLEXBOX CONTAINER -->
        <div id="layout">

            <!-- FLEXBOX ITEM -->
            <div id="thumbnail-column">
                <ul>
                    <li>
                        <img
                            src="images/thumbnail1.webp"
                            alt="corner face view"
                        >
                    </li>
                    <li>
                        <img
                            src="images/thumbnail2.webp"
                            alt="Left face view"
                        >
                    </li>
                    <li>
                        <img
                            src="images/thumbnail3.webp"
                            alt="Right face view"
                        >
                    </li>
                    <li>
                        <img
                            src="images/thumbnail4.webp"
                            alt="back view"
                        >
                    </li>
                    <li>
                        <img
                            src="images/thumbnail5.webp"
                            alt="close face view"
                        >
                    </li>  
                </ul>

            </div>

            <!-- FLEXBOX ITEM -->
            <div id="featured-image-column">
                 <img
                            src="images/featured-image.webp"
                            alt="face view"
                        >
            </div>

            <!-- FLEXBOX ITEM -->
            <div id="product-info-column">
                <div>
                    <h2>
                        Rolex Day-Date 40 Diamonds Rose Gold President - 
                        228345RBR Full Set
                    </h2>
                    <hr>
                    <img 
                        src="images/mebay-product-logo.jpg"
                        alt="logo"
                    >
                    <a href="#">Watches of Charlotte</a> 
                    <br>
                    <a href="#">100% Positive</a>
                    <a href="#">Seller's other items</a>
                    <a href="#">Contact seller</a>
                    <hr>
                </div>

                <h3>US $67,500.00 <span>or Best Offer</span></h3>
                <p>
                    Condition:  
                    <a href="#">Pre-owned - Excellent</a>
                </p>
                <div class="buttons-menu">
                    <a href="#" class="button primary">Buy</a>
                    <a href="#" class="button secondary">Add to cart</a>
                    <a href="#" class="button secondary">Add to wishlist</a>
                </div>
    

            </div>

        </div>

    </body>
</html>
