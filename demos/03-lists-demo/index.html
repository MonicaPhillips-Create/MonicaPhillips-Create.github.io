<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lists Demo</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <h2>Unordered List</h2>
        <ul>
            <li>This is a list item element</li>
            <li>cereal</li>
            <li>milk</li>
            <li>eggs</li>
        </ul>
        <h2>Order List</h2>
        <ol>
            <li>This is another list element.</li>
            <li>Here's another one</li>
            <li>another one</li>
        </ol>
    </body>
</html>
